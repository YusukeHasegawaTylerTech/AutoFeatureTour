<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Original and redacted</title>
  <link rel="stylesheet" href="tour.css" />
  <style>
    .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    figure { margin: 0; background: #fff; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.2); padding: 12px; }
    figcaption { font-weight: 500; margin-bottom: 8px; font-size: 17px; }
    canvas { width: 100%; display: block; border: 1px solid #e0e0e0; }
  </style>
</head>
<body>
  <!-- Tour helper: a page (?page=n, default 1) of the original and the redacted PDF side by side (?a=<original url>&b=<redacted url>). -->
  <header>Original and redacted copy, side by side</header>
  <main class="panes">
    <figure><figcaption>Original <span class="muted">(never released)</span></figcaption><canvas id="a"></canvas></figure>
    <figure><figcaption>Redacted export <span class="muted">(text removed, no text layer)</span></figcaption><canvas id="b"></canvas></figure>
  </main>
  <script type="module">
    import * as pdfjs from '/tour/pdfjs/pdf.min.mjs';
    pdfjs.GlobalWorkerOptions.workerSrc = '/tour/pdfjs/pdf.worker.min.mjs';
    const q = new URLSearchParams(location.search);
    // ?page=n picks the page (default 1); window.showPage(n) switches both panes.
    const docs = {};
    // ?kind=image: the two URLs are images (a photo and its redacted export), drawn as they are.
    if (q.get('kind') === 'image') document.querySelector('#b').previousElementSibling.lastElementChild.textContent = '(words painted out, metadata removed)';
    async function draw(id, url, n) {
      if (q.get('kind') === 'image') {
        const img = new Image(); img.src = url; await img.decode();
        const canvas = document.getElementById(id);
        canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        return;
      }
      const pdf = docs[id] ??= await pdfjs.getDocument(url).promise;
      const pg = await pdf.getPage(Math.min(n, pdf.numPages));
      const canvas = document.getElementById(id);
      const width = canvas.clientWidth * devicePixelRatio;
      const vp = pg.getViewport({ scale: width / pg.getViewport({ scale: 1 }).width });
      canvas.width = vp.width; canvas.height = vp.height;
      await pg.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
    }
    window.showPage = n => Promise.all([draw('a', q.get('a'), n), draw('b', q.get('b'), n)]);
    await window.showPage(Number(q.get('page') ?? 1));
    window.tourReady = true;
  </script>
</body>
</html>
