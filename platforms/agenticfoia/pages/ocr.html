<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>What OCR read</title>
  <link rel="stylesheet" href="tour.css" />
  <style>
    .panes { display: grid; grid-template-columns: 560px 1fr; gap: 28px; align-items: start; }
    figure { margin: 0; background: #fff; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.2); padding: 12px; position: relative; }
    canvas { width: 100%; display: block; border: 1px solid #e0e0e0; }
    .side { display: flex; flex-direction: column; gap: 14px; }
    .card { background: #fff; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.2); padding: 14px 20px; }
    .stats { display: flex; gap: 28px; font-size: 15px; }
    .stats b { display: block; font-size: 12px; color: #616161; font-weight: 500; }
    pre { margin: 0; font: 13px/1.5 Consolas, monospace; white-space: pre-wrap; max-height: 300px; overflow: hidden; }
    .json { font-size: 12px; color: #37474f; }
    .json .k { color: #6a1b9a; } .json .n { color: #1565c0; }
    .hl { background: #fff59d; }
  </style>
</head>
<body>
  <!-- Tour helper: the stored OCR layout of a scanned PDF page drawn over the page (?doc=<document api url>&pdf=<original url>&dpi=200).
       window.reveal(ms) draws the word boxes in reading order; window.focusWord(text) highlights one word and shows its stored entry. -->
  <header>What text recognition read, and where each word is</header>
  <main class="panes">
    <figure><canvas id="page"></canvas></figure>
    <div class="side">
      <div class="card stats">
        <div><b>Recognized by</b>Tesseract 5 (LSTM), on this machine</div>
        <div><b>Words</b><span id="words">…</span></div>
        <div><b>Page image</b><span id="px">…</span></div>
        <div><b>Pinned to SHA-256</b><span id="sha">…</span></div>
      </div>
      <div class="card"><b class="muted small">Text sent for review (page 1)</b><pre id="text"></pre></div>
      <div class="card"><b class="muted small">Stored with the file (extracted.json → layout)</b><pre class="json" id="entry">{ "start": …, "length": …, "boxes": [ { "x": …, "y": …, "w": …, "h": … } ] }</pre></div>
    </div>
  </main>
  <script type="module">
    import * as pdfjs from '/tour/pdfjs/pdf.min.mjs';
    pdfjs.GlobalWorkerOptions.workerSrc = '/tour/pdfjs/pdf.worker.min.mjs';
    const q = new URLSearchParams(location.search);
    const dpi = Number(q.get('dpi') ?? 200);
    const view = await (await fetch(q.get('doc'))).json();
    const seg = view.segments[0];
    const tokens = view.layout.segments[0].tokens.filter(t => t.boxes?.length);

    const pdf = await pdfjs.getDocument(q.get('pdf')).promise;
    const pg = await pdf.getPage(1);
    const canvas = document.getElementById('page');
    const base = pg.getViewport({ scale: 1 });
    const vp = pg.getViewport({ scale: canvas.clientWidth * devicePixelRatio / base.width });
    canvas.width = vp.width; canvas.height = vp.height;
    const ctx = canvas.getContext('2d');
    await pg.render({ canvasContext: ctx, viewport: vp }).promise;
    const pageImage = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const k = canvas.width / (base.width * dpi / 72); // stored boxes are pixels of the page rendered at `dpi`

    document.getElementById('words').textContent = tokens.length;
    document.getElementById('px').textContent = `${Math.round(base.width * dpi / 72)} × ${Math.round(base.height * dpi / 72)} px (${dpi} DPI)`;
    document.getElementById('sha').textContent = view.metadata.sha256.slice(0, 12) + '…';
    const textEl = document.getElementById('text');
    textEl.textContent = seg.text;

    let shown = 0, focus = null;
    function draw() {
      ctx.putImageData(pageImage, 0, 0);
      tokens.slice(0, shown).forEach(t => {
        const b = t.boxes[0];
        const on = t === focus;
        ctx.fillStyle = on ? 'rgba(255,193,7,.45)' : 'rgba(63,81,181,.18)';
        ctx.strokeStyle = on ? '#ff8f00' : '#3f51b5';
        ctx.lineWidth = on ? 3 : 1.2;
        ctx.fillRect(b.x * k, b.y * k, b.w * k, b.h * k);
        ctx.strokeRect(b.x * k, b.y * k, b.w * k, b.h * k);
      });
    }
    window.reveal = async ms => {
      const step = ms / Math.max(tokens.length, 1);
      for (shown = 0; shown <= tokens.length; shown++) { draw(); await new Promise(r => setTimeout(r, step)); }
      shown = tokens.length; draw();
    };
    window.focusWord = text => {
      focus = tokens.find(t => seg.text.substr(t.start, t.length).includes(text)) ?? null;
      draw();
      if (!focus) return;
      const b = focus.boxes[0];
      const word = seg.text.substr(focus.start, focus.length);
      document.getElementById('entry').innerHTML =
        `<span class="k">"text"</span>: "${word.replace(/[<&]/g, '')}"  <span class="muted">(page text, characters ${focus.start}–${focus.start + focus.length})</span>\n` +
        `{ <span class="k">"start"</span>: <span class="n">${focus.start}</span>, <span class="k">"length"</span>: <span class="n">${focus.length}</span>, ` +
        `<span class="k">"boxes"</span>: [ { <span class="k">"x"</span>: <span class="n">${b.x}</span>, <span class="k">"y"</span>: <span class="n">${b.y}</span>, ` +
        `<span class="k">"w"</span>: <span class="n">${b.w}</span>, <span class="k">"h"</span>: <span class="n">${b.h}</span> } ] }`;
      const at = seg.text.indexOf(word, focus.start);
      textEl.innerHTML = '';
      textEl.append(seg.text.slice(0, at));
      const mark = document.createElement('span'); mark.className = 'hl'; mark.textContent = word; textEl.append(mark);
      textEl.append(seg.text.slice(at + word.length));
    };
    draw();
    window.tourReady = true;
  </script>
</body>
</html>
