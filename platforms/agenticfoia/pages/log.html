<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Redaction log</title>
  <link rel="stylesheet" href="tour.css" />
  <style>
    .summary { display: flex; gap: 40px; margin-bottom: 16px; font-size: 16px; }
    .summary b { display: block; font-size: 13px; color: #616161; font-weight: 500; }
    table { width: 100%; border-collapse: collapse; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
    th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid #e0e0e0; vertical-align: top; }
    th { background: #eceff1; font-weight: 500; position: sticky; top: 0; }
    .Approved { color: #2e7d32; font-weight: 500; } .Denied { color: #c62828; font-weight: 500; }
  </style>
</head>
<body>
  <!-- Tour helper: shows an export's redaction-log.json (?url=<log url>&name=<file name>). The log never holds the redacted text. -->
  <header>Redaction log · <span id="name"></span></header>
  <main>
    <div class="summary" id="summary"></div>
    <table>
      <thead><tr><th>#</th><th>Decision</th><th>Category</th><th>Reason</th><th>Page</th><th>Reviewer</th><th>Decided</th><th>Note</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </main>
  <script type="module">
    const q = new URLSearchParams(location.search);
    const log = await (await fetch(q.get('url'))).json();
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
    const when = s => s ? new Date(s).toLocaleString('en-US', { dateStyle: 'short', timeStyle: 'short' }) : '';
    // A response packet's combined log (log.documents[].log) is shown as one table, with the file in place of the page.
    const packet = Array.isArray(log.documents);
    const entries = packet
      ? log.documents.flatMap(d => (d.log?.entries ?? []).map(e => ({ ...e, page: d.source?.documentName ?? d.log?.originalFileName })))
      : log.entries;
    document.getElementById('name').textContent = q.get('name') ?? log.originalFileName ?? log.requestNumber;
    document.getElementById('summary').innerHTML = packet
      ? `<div><b>Request</b>${esc(log.requestNumber)}</div><div><b>Packet approved by</b>${esc(log.approvedBy)}</div>` +
        `<div><b>Approved</b>${esc(when(log.approvedAt))}</div><div><b>Files</b>${log.documents.length}</div>` +
        `<div><b>Redactions</b>${entries.filter(e => e.decision === 'Approved').length}</div>`
      : `<div><b>Exported</b>${esc(when(log.exportedAt))}</div><div><b>Approved</b>${log.approved}</div>` +
        `<div><b>Denied</b>${log.denied}</div><div><b>Original SHA-256</b>${esc(log.originalSha256.slice(0, 16))}…</div>`;
    if (packet) document.querySelector('thead th:nth-child(5)').textContent = 'File';
    document.getElementById('rows').innerHTML = entries.map((e, n) =>
      `<tr><td>${n + 1}</td><td class="${esc(e.decision)}">${esc(e.decision)}</td><td>${esc(e.category)}</td><td>${esc(e.reason)}</td>` +
      `<td>${esc(e.page)}</td><td>${esc(e.reviewer)}</td><td>${esc(when(e.decidedAt))}</td><td>${esc(e.note)}</td></tr>`).join('');
    window.tourReady = true;
  </script>
</body>
</html>
