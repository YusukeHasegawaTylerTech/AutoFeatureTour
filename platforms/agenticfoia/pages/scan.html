<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>A scanned page</title>
  <link rel="stylesheet" href="tour.css" />
  <style>
    .panes { display: grid; grid-template-columns: 560px 1fr; gap: 32px; align-items: start; }
    figure { margin: 0; background: #fff; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.2); padding: 12px; }
    canvas { width: 100%; display: block; border: 1px solid #e0e0e0; cursor: text; }
    .facts { background: #fff; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.2); padding: 20px 28px; font-size: 18px; }
    .facts dt { color: #616161; font-size: 14px; margin-top: 14px; }
    .facts dd { margin: 2px 0 0; font-size: 26px; font-weight: 500; }
    .zero { color: #c62828; }
    .search { margin-top: 22px; display: flex; gap: 8px; align-items: center; }
    .search input { font: inherit; padding: 6px 10px; width: 260px; }
    .result { color: #c62828; font-weight: 500; min-height: 1.4em; margin-top: 8px; }
  </style>
</head>
<body>
  <!-- Tour helper: a PDF page plus what a computer can read from it (?pdf=<url>&name=<file name>). -->
  <header>A scanned page · <span id="name"></span></header>
  <main class="panes">
    <figure><canvas id="page"></canvas></figure>
    <dl class="facts">
      <dt>Pages</dt><dd id="pages">…</dd>
      <dt>Text characters a computer can read</dt><dd id="chars" class="zero">…</dd>
      <dt>What the page is made of</dt><dd id="kind">…</dd>
      <div class="search"><input id="q" placeholder="Search this PDF" /><span class="muted">Ctrl+F</span></div>
      <div class="result" id="result"></div>
    </dl>
  </main>
  <script type="module">
    import * as pdfjs from '/tour/pdfjs/pdf.min.mjs';
    pdfjs.GlobalWorkerOptions.workerSrc = '/tour/pdfjs/pdf.worker.min.mjs';
    const q = new URLSearchParams(location.search);
    document.getElementById('name').textContent = q.get('name') ?? '';
    const pdf = await pdfjs.getDocument(q.get('pdf')).promise;
    let chars = 0, images = 0;
    for (let n = 1; n <= pdf.numPages; n++) {
      const pg = await pdf.getPage(n);
      chars += (await pg.getTextContent()).items.reduce((s, i) => s + (i.str ?? '').trim().length, 0);
      const ops = await pg.getOperatorList();
      images += ops.fnArray.filter(f => f === pdfjs.OPS.paintImageXObject || f === pdfjs.OPS.paintJpegXObject).length;
    }
    const pg = await pdf.getPage(1);
    const canvas = document.getElementById('page');
    const vp = pg.getViewport({ scale: canvas.clientWidth * devicePixelRatio / pg.getViewport({ scale: 1 }).width });
    canvas.width = vp.width; canvas.height = vp.height;
    await pg.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
    document.getElementById('pages').textContent = pdf.numPages;
    document.getElementById('chars').textContent = chars;
    document.getElementById('kind').textContent = chars ? 'text' : `${images} picture${images === 1 ? '' : 's'}, no text`;
    // Typing in the search box searches the PDF's real text layer, like a viewer's Ctrl+F.
    document.getElementById('q').addEventListener('input', e => {
      const t = e.target.value.trim();
      document.getElementById('result').textContent = t ? (chars ? '' : `No matches for "${t}"`) : '';
    });
    window.tourReady = true;
  </script>
</body>
</html>
